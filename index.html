<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>那些我去過的旅行印足跡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #000;
      min-height: 100vh;
      padding: 16px 12px 40px;
      color: #f9a8d4;
      font-size: 14px;
    }
    h1 { 
      text-align: center; 
      font-size: 1.3rem; 
      color: #f9a8d4; 
      margin-bottom: 4px; 
    }
    .sub { 
      text-align: center; 
      font-size: 0.82rem; 
      color: #9d174d; 
      margin-bottom: 18px; 
    }

    .main {
      max-width: 1000px;
      margin: 0 auto 20px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .map-box {
      position: relative;
      flex: 1;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.12);
      background: #111;
    }
    .map-box img { 
      width: 100%; 
      height: auto; 
      display: block; 
      opacity: 0.92; 
    }

    .city-panel {
      width: 200px;
      background: #111;
      border-radius: 14px;
      border: 1px solid #3f3f46;
      padding: 12px;
      min-height: 260px;
      display: none;
    }
    .city-panel.show { display: block; }
    .city-panel h3 {
      color: #fbbf24;
      font-size: 0.9rem;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #3f3f46;
    }
    .city-list { display: flex; flex-direction: column; gap: 6px; }
    .city-item {
      background: #1c1917;
      color: #fbbf24;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      border: 1px solid #fbbf24;
      line-height: 1.3;
    }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f472b6;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10;
      pointer-events: none;
    }
    .dot.show {
      opacity: 1;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.4);
    }

    .countries {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .country-btn {
      background: #111;
      border-radius: 12px;
      border: 1px solid #3f3f46;
      padding: 12px 8px;
      text-align: center;
      color: #f9a8d4;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.84rem;
      user-select: none;
      line-height: 1.35;
    }
    .country-btn:hover { border-color: #f472b6; }
    .country-btn.active {
      color: #fbbf24;
      border-color: #fbbf24;
      background: #1c1917;
    }

    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.78rem;
      color: #6b7280;
    }

    /* ===== 手機優化 ===== */
    @media (max-width: 768px) {
      body { padding: 14px 10px 36px; }
      h1 { font-size: 1.2rem; }
      .sub { font-size: 0.8rem; margin-bottom: 14px; }

      .main {
        flex-direction: column;
        gap: 12px;
      }

      .city-panel {
        width: 100%;
        min-height: auto;
        order: 2;
      }

      .map-box {
        order: 1;
      }

      .countries {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .country-btn {
        padding: 11px 6px;
        font-size: 0.82rem;
      }

      .city-item {
        font-size: 0.82rem;
        padding: 7px 10px;
      }
    }

    @media (max-width: 400px) {
      .countries {
        grid-template-columns: repeat(2, 1fr);
      }
      .country-btn {
        font-size: 0.78rem;
        padding: 10px 4px;
      }
    }
  </style>
</head>

  <script>
    function showCountry(name, cities, ids) {
      document.querySelectorAll('.country-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.dot').forEach(d => d.classList.remove('show'));

      event.currentTarget.classList.add('active');

      const panel = document.getElementById('cityPanel');
      const title = document.getElementById('panelTitle');
      const list = document.getElementById('cityList');

      panel.classList.add('show');
      title.textContent = name;
      list.innerHTML = cities.map(c => `<div class="city-item">${c}</div>`).join('');

      ids.forEach(id => {
        const dot = document.getElementById('dot-' + id);
        if (dot) dot.classList.add('show');
      });
    }
  </script>
