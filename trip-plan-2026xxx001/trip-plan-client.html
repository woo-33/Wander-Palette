<title>匈牙利・奧地利・捷克 行程策劃</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f2a37;--muted:#7a8088;--line:#e9e3d8;--accent:#c4553a;--indigo:#234e70;--green:#4a7c59;--soft:#f1ece2}

main{max-width:640px;margin:0 auto;padding:14px 12px}
section{display:none}section.on{display:block}

.card{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(31,42,55,.07);overflow:hidden}
.card.dragging{opacity:.45;border:2px dashed var(--indigo)}

.dh{display:flex;gap:10px;align-items:center;padding:13px 14px}

.drag-handle:active{cursor:grabbing}
.dn{flex:none;width:46px;height:46px;border-radius:13px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.dn.done{background:var(--green)}
.dt{flex:1;min-width:0}.dt b{display:block;font-size:15px;line-height:1.3}
.dt span{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);transition:.2s}details[open] .chev{transform:rotate(180deg)}
.day-del{border:0;background:none;color:var(--accent);font-size:18px;padding:4px 6px;cursor:pointer;opacity:.8}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.stay{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin:10px 0}
.tl{margin:10px 0 4px;position:relative}
.it{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.it:last-child{border:0}
.it-fold{border-bottom:1px dashed var(--line)}
.it-fold>summary{list-style:none;cursor:pointer}
.it-fold>summary::-webkit-details-marker{display:none}
.it-fold[open]>summary .chev{transform:rotate(180deg)}
.it-fold>summary .ib p{color:var(--muted);font-size:12px}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;margin-top:2px;position:relative}
.ck.on{background:var(--green);border-color:var(--green)}.ck.on:after{content:"✓";position:absolute;inset:0;color:#fff;font-size:12px;line-height:18px;text-align:center}
.ib{flex:1;min-width:0}.ib b{font-size:14.5px}.ib p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.cost{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:12px;font-weight:700;color:var(--accent);background:#fbece7;border-radius:999px;padding:1px 9px}
.cost .xcost{border:0;background:none;color:var(--accent);font-size:14px;line-height:1;padding:0 2px;cursor:pointer;opacity:.7}
.cost.linked{background:#e3f1e7;color:#2e6b42}
.tip{background:#fff6e3;border-left:4px solid #e7b04a;border-radius:8px;padding:8px 11px;margin:8px 0;font-size:13px;position:relative}
.tip.personal{background:#f0f4f8;border-left-color:#5a7a9a}
.tip .tip-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.tip textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font:inherit;font-size:13px;min-height:48px;resize:vertical;margin-top:4px}
.tip .del,.trap .del{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--accent);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
label{display:block;font-size:12px;font-weight:700;color:var(--indigo);margin:12px 0 5px}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);outline:0}

.er select,.er input{padding:8px 6px;font-size:13px}
.er button{border:0;background:none;color:var(--accent);font-size:20px}

.sub{float:right;font-size:12px;color:var(--accent);font-weight:700;margin-top:6px}
.bk{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}

.bkb{padding:0 14px 14px 48px;position:relative}
.how{font-size:13px;margin:0 0 6px;position:relative;padding-right:20px}
.del-item{border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:0 4px;opacity:.75}
.srow{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.sbar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.sbar i{display:block;height:100%}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin:8px 0 3px}

.cols i{display:block;width:100%;background:var(--indigo);border-radius:4px 4px 0 0;min-height:2px}
.lab{display:flex;gap:3px;font-size:10px;color:var(--muted)}.lab span{flex:1;text-align:center}
.big{font-size:30px;font-weight:800;color:var(--accent)}
.pad{padding:14px}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:var(--indigo)}

.trap{padding:11px 14px;position:relative}.trap b{display:block;font-size:14px}.trap p{margin:3px 0 0;font-size:13px;color:#4a5159}
.vs{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;font-size:11px;color:var(--muted);padding:5px 0;font-weight:700}
.tabs button span{display:block;font-size:20px;line-height:1.2}
.tabs button.on{color:var(--accent)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}#md div{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:520px}

.sec-title{font-size:13px;font-weight:700;color:var(--indigo);margin:14px 0 6px}
.add-tip{border:1px dashed var(--indigo);background:none;color:var(--indigo);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-top:6px;white-space:nowrap}
.add-day{display:block;width:100%;border:2px dashed var(--indigo);background:none;color:var(--indigo);border-radius:14px;padding:12px;font-size:14px;font-weight:700;margin:8px 0 16px}
.item-del{border:0;background:none;color:var(--accent);font-size:16px;padding:0 2px;cursor:pointer;opacity:.7;margin-top:2px}
.hint{font-size:12px;color:var(--muted);margin:0 4px 10px}
</style>
</head>

      const m=fn(k);

    });
    return n;
  };
  // 這裡在呼叫端處理

function getTips(i){
  if(S.tips[i] && Array.isArray(S.tips[i])) return S.tips[i];
  return (days()[i].tips||[]).slice();
}
function getPersonal(i){
  const list=days()[i].personal||[];

  return list.map((t,idx)=>({t,idx})).filter(x=>!del.includes(x.idx));
}

  const key=dayIdx+"-"+itemIdx;

  const linkedId=x[4];
  if(linkedId){
    const price=bkPrice(linkedId);
    if(price!=null) return '<span class="cost linked">已確認 ¥'+price+' <button class="xcost" data-del-cost="'+key+'" title="隱藏">×</button></span>';
  }
  return "";
}

function bindDrag(){
  let dragIdx=null;
  document.querySelectorAll("#t0 details.card").forEach(card=>{
    card.addEventListener("dragstart",e=>{
      if(e.target.closest("input,textarea,button,[contenteditable]")) {e.preventDefault();return;}
      dragIdx=+card.dataset.i;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain",dragIdx);
    });
    card.addEventListener("dragend",()=>{
      card.classList.remove("dragging");
      document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));
      dragIdx=null;
    });
    card.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));
    card.addEventListener("drop",e=>{
      e.preventDefault();
      card.classList.remove("drag-over");
      const from=+e.dataTransfer.getData("text/plain");
      const to=+card.dataset.i;
      if(isNaN(from)||isNaN(to)||from===to) return;
      // 移動天
      const arr=days();
      const [item]=arr.splice(from,1);
      arr.splice(to,0,item);
      // 重新對應本地資料
      const remap=(obj)=>{
        const n={};
        Object.keys(obj||{}).forEach(k=>{
          if(k.includes("-")){
            const [di,ji]=k.split("-").map(Number);
            let ndi=di;
            if(di===from) ndi=to;
            else if(from<to && di>from && di<=to) ndi=di-1;
            else if(from>to && di>=to && di<from) ndi=di+1;
            n[ndi+"-"+ji]=obj[k];
          } else {
            let di=+k, ndi=di;
            if(di===from) ndi=to;
            else if(from<to && di>from && di<=to) ndi=di-1;
            else if(from>to && di>=to && di<from) ndi=di+1;
            n[ndi]=obj[k];
          }
        });
        return n;
      };
      S.act=remap(S.act);
      S.dn=remap(S.dn);
      S.ex=remap(S.ex);
      S.tips=remap(S.tips);
      S.delPersonal=remap(S.delPersonal);
      S.delCost=remap(S.delCost);
      renumberDays();
      save();
      renderPlan();
    });
  });
}

function totals(){let n=0;const cs={};cats.forEach(c=>cs[c[0]]=0);const ds=days().map((_,i)=>{const d=sumDay(i);n+=d;(S.ex[i]||[]).forEach(x=>{cs[x.c]=(cs[x.c]||0)+(Number(x.a)||0)});return d});const bt=bkTotal();n+=bt;return{n,cs,ds,bt}}

 $("#pTxt").textContent="預訂進度 "+done+" / "+steps().length;$("#pBar").style.width=(done/steps().length*100)+"%";

 if(i===0)renderPlan();
 if(i===1)renderBook();

 if(i===3)renderInfo();
 window.scrollTo(0,0);try{localStorage.setItem(KEY+":tab",i)}catch(e){}
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(+b.dataset.t));

 const t=e.target;
 if(t.dataset.ck){e.preventDefault();S.act[t.dataset.ck]=!S.act[t.dataset.ck];save();t.classList.toggle("on");const i=+t.dataset.ck.split("-")[0],[k,n]=dayProg(i);const det=t.closest("details");const dn=det.querySelector(".dn");dn.classList.toggle("done",k===n);det.querySelector(".dt span").textContent=(days()[i].c||"")+" · 已完成 "+k+"/"+n}
 else if(t.dataset.bk){e.preventDefault();e.stopPropagation();const b=S.bk[t.dataset.bk]=S.bk[t.dataset.bk]||{};b.done=!b.done;save();t.classList.toggle("on");refresh();renderPlan()}
 else if(t.dataset.vs){S.vs[t.dataset.vs]=!S.vs[t.dataset.vs];save();t.classList.toggle("on")}
 else if(t.classList.contains("add")){const i=t.parentNode.dataset.ex;(S.ex[i]=S.ex[i]||[]).push({c:"餐飲",a:"",n:""});save();renderExp(i)}

 else if(t.id==="bReset"){if(confirm("清除所有你填寫的記錄？建議先複製備份。")){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}}

 else if(t.dataset.delBkCost){e.preventDefault();e.stopPropagation();S.delBkCost[t.dataset.delBkCost]=true;save();renderBook()}
 else if(t.dataset.delBkTip){e.preventDefault();e.stopPropagation();S.delBkTip[t.dataset.delBkTip]=true;save();renderBook()}
 else if(t.dataset.restoreHow){e.preventDefault();e.stopPropagation();delete S.delBkHow[t.dataset.restoreHow];const s=stepById(t.dataset.restoreHow);if(s&&!s.how)s.how="";save();renderBook()}
 else if(t.dataset.restoreCost){e.preventDefault();e.stopPropagation();delete S.delBkCost[t.dataset.restoreCost];const s=stepById(t.dataset.restoreCost);if(s&&!s.cost)s.cost="";save();renderBook()}
 else if(t.dataset.restoreTip){e.preventDefault();e.stopPropagation();delete S.delBkTip[t.dataset.restoreTip];const s=stepById(t.dataset.restoreTip);if(s&&!s.tip)s.tip="";save();renderBook()}

   steps().push({id:id,p:p,t:"新預訂項目",w:"",how:"",cost:"",tip:""});
   save();renderBook();refresh();
 }
 else if(t.dataset.delStep){
   e.preventDefault();e.stopPropagation();
   if(!confirm("確定刪除此預訂項目？")) return;
   const id=t.dataset.delStep;
   const idx=steps().findIndex(s=>s.id===id);
   if(idx>=0) steps().splice(idx,1);
   delete S.bk[id];
   save();renderBook();refresh();renderPlan();
 }
 else if(t.dataset.delTrap!==undefined){S.traps.splice(+t.dataset.delTrap,1);save();renderInfo()}
 else if(t.dataset.delNote!==undefined){S.notes.splice(+t.dataset.delNote,1);save();renderInfo()}
 else if(t.dataset.delVisa!==undefined){S.visa.splice(+t.dataset.delVisa,1);const vs={};Object.keys(S.vs||{}).forEach(k=>{const ki=+k;if(ki>+t.dataset.delVisa)vs[ki-1]=S.vs[k];else if(ki<+t.dataset.delVisa)vs[ki]=S.vs[k]});S.vs=vs;save();renderInfo()}
 else if(t.hasAttribute("data-add-trap")){S.traps.push({t:"新注意事項",d:""});save();renderInfo()}
 else if(t.hasAttribute("data-add-note")){S.notes.push({t:"新注意事項",d:""});save();renderInfo()}
 else if(t.hasAttribute("data-add-visa")){S.visa.push("新材料項目");save();renderInfo()}
 // 刪除整天
 else if(t.dataset.delDay!==undefined){
   e.preventDefault();e.stopPropagation();
   const i=+t.dataset.delDay;
   if(!confirm("確定刪除 "+(days()[i].d)+" 嗎？")) return;
   days().splice(i,1);
   // 重新對應資料
   const remap=(obj)=>{
     const n={};
     Object.keys(obj||{}).forEach(k=>{
       if(k.includes("-")){
         const [di,ji]=k.split("-").map(Number);
         if(di<i) n[di+"-"+ji]=obj[k];
         else if(di>i) n[(di-1)+"-"+ji]=obj[k];
       } else {
         const di=+k;
         if(di<i) n[di]=obj[k];
         else if(di>i) n[di-1]=obj[k];
       }
     });
     return n;
   };
   S.act=remap(S.act);S.dn=remap(S.dn);S.ex=remap(S.ex);S.tips=remap(S.tips);S.delPersonal=remap(S.delPersonal);S.delCost=remap(S.delCost);
   renumberDays();save();renderPlan();refresh();
 }
 // 新增一天
 else if(t.id==="addDay"){
   days().push({d:"D"+(days().length+1),c:"",t:"新行程日",stay:"",bk:[],it:[],tips:[],personal:[]});
   renumberDays();save();renderPlan();
 }
 // 刪除行程項目
 else if(t.dataset.delItem){
   const [di,ji]=t.dataset.delItem.split("-").map(Number);
   days()[di].it.splice(ji,1);
   // 調整該天 act / delCost
   const nAct={},nCost={};
   Object.keys(S.act||{}).forEach(k=>{
     const [d,j]=k.split("-").map(Number);
     if(d!==di) nAct[k]=S.act[k];
     else if(j<ji) nAct[d+"-"+j]=S.act[k];
     else if(j>ji) nAct[d+"-"+(j-1)]=S.act[k];
   });
   Object.keys(S.delCost||{}).forEach(k=>{
     const [d,j]=k.split("-").map(Number);
     if(d!==di) nCost[k]=S.delCost[k];
     else if(j<ji) nCost[d+"-"+j]=S.delCost[k];
     else if(j>ji) nCost[d+"-"+(j-1)]=S.delCost[k];
   });
   S.act=nAct;S.delCost=nCost;save();renderPlan();
 }
 // 新增行程項目
 else if(t.dataset.addItem){
   const i=+t.dataset.addItem;
   days()[i].it.push(["景","新景點","",""]);
   save();renderPlan();
 }
});

   } else if(p) p.remove();
 }
 else if(d.itCost){
   const [di,ji]=d.itCost.split("-").map(Number);
   days()[di].it[ji][3]=t.value;save();
   const fold=t.closest(".it-fold");
   const ib=fold&&fold.querySelector("summary .ib");
   if(!ib) return;
   let costEl=ib.querySelector("span.cost:not(.linked)");
   if(t.value.trim()){
     if(!costEl){
       costEl=document.createElement("span");
       costEl.className="cost";
       costEl.style.marginLeft="6px";
       const b=ib.querySelector("b");
       if(b) b.insertAdjacentElement("afterend",costEl);
       else ib.appendChild(costEl);
     }
     costEl.textContent=t.value;
   } else if(costEl) costEl.remove();
 }
 // 預訂內容可編輯
 else if(d.bkT){const s=stepById(d.bkT);if(s){s.t=t.value;save();const b=t.closest("details")?.querySelector(".bkh b");if(b)b.textContent=t.value}}
 else if(d.bkW){const s=stepById(d.bkW);if(s){s.w=t.value;save();const st=t.closest("details")?.querySelector(".bkh .st");if(st)st.textContent=t.value}}
 else if(d.bkHow){const s=stepById(d.bkHow);if(s){s.how=t.value;save()}}
 else if(d.bkCost){const s=stepById(d.bkCost);if(s){s.cost=t.value;save()}}
 else if(d.bkTip){const s=stepById(d.bkTip);if(s){s.tip=t.value;save()}}
});
document.addEventListener("change",e=>{
 const t=e.target,d=t.dataset;
 if(t.classList.contains("ec")){const box=t.closest("[data-ex]"),x=S.ex[box.dataset.ex][+t.closest(".er").dataset.j];x.c=t.value;save()}
 else if(d.itType){
   const [di,ji]=d.itType.split("-").map(Number);
   days()[di].it[ji][0]=t.value;save();
   const fold=t.closest(".it-fold");
   const b=fold&&fold.querySelector("summary .ib b");
   if(b) b.textContent=(IC[t.value]||"📌")+" "+(days()[di].it[ji][1]||"未命名");
 }
 else if(d.bkP){const s=stepById(d.bkP);if(s){s.p=t.value;save();renderBook()}}
});

// 阻止 contenteditable 拖曳干擾
document.addEventListener("dragstart",e=>{if(e.target.isContentEditable) e.preventDefault()});

try{
  renderPlan();renderBook();renderInfo();refresh();
  let t0=0;try{t0=+localStorage.getItem(KEY+":tab")||0}catch(e){}
  show(t0>3?0:t0);
  // 若行程仍為空，強制重建
  if(!days().length){
    S.days=JSON.parse(JSON.stringify(TRIP.days));
    save();renderPlan();
  }
}catch(err){
  console.error(err);
  const el=document.getElementById("t0");
  if(el) el.innerHTML='<div class="card pad" style="color:var(--accent)"><b>載入出錯</b><p style="font-size:13px;margin:8px 0">'+esc(err.message)+'</p><p style="font-size:12px;color:var(--muted)">請用 Chrome / Safari 直接打開此 HTML 檔，不要用微信內建瀏覽器。也可點下方重置。</p><button class="add-day" onclick="localStorage.clear();location.reload()">清除快取並重新載入</button></div>';
  el && el.classList.add("on");
}
})();
</script>
</body>
</html>
